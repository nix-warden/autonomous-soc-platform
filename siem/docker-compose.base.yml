services:
  # * ---------------------------------------------------------------------------------------
  # * Wazuh Manager service: Handles agent registration, configuration management, log analysis,
  # * alerting, and provides the Wazuh API. It acts as the central brain of the Wazuh platform.
  # * ---------------------------------------------------------------------------------------
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    hostname: wazuh.manager
    restart: always
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL="https://wazuh.indexer:9200"
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD} # ? Using environment variable
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD} # ? Using environment variable
    deploy:
      resources:
        limits:
          memory: ${WAZUH_MANAGER_MEM_LIMIT}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT   # ! Critical: Wazuh daemons live in chroot
      - SETGID       # ! Critical: drops privileges from root to wazuh
      - SETUID       # ! Critical: drops privileges from root to wazuh
      - DAC_OVERRIDE # ! Critical: bypasses permission checks during file initialization
      - CHOWN        # ! Critical: for entrypoint.sh (fixing permissions on volumes)
      - FOWNER       # ! Critical: manages file attributes
      - KILL         # * Required for wazuh-control (stopping/restarting daemons)
      - SETPCAP      # * Required for s6-overlay to manage capabilities of child processes
      - FSETID       # ? Might be needed when creating sockets and log files
    networks:
      - soc_overlay
    volumes:
      # * Wazuh and Filebeat internal configuration and data persistence
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      # * Mapped certificates and configuration from host
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:Z
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:Z
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:Z
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/etc/ssl/root-ca.pem:z

  # * ---------------------------------------------------------------------------------------
  # * Wazuh Indexer service: An OpenSearch-based highly scalable, full-text search and analytics engine.
  # * It indexes and stores alerts generated by the Wazuh server and provides near real-time data search.
  # * ---------------------------------------------------------------------------------------
  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION}
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms${WAZUH_INDEXER_HEAP} -Xmx${WAZUH_INDEXER_HEAP}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: ${WAZUH_INDEXER_MEM_LIMIT} # ! Enforcing memory limits
    security_opt:
      - no-new-privileges:true
    networks:
      - soc_overlay
    healthcheck:
      test: ["CMD", "curl", "-s", "-k", "-u", "admin:${WAZUH_INDEXER_PASSWORD}", "https://localhost:9200"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      # * Data persistence and configuration mounting for the indexer
      - ./config/wazuh-indexer-data:/var/lib/wazuh-indexer:Z
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:z
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:Z
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:Z
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:Z
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:Z
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:Z
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:Z

  # * ---------------------------------------------------------------------------------------
  # * Wazuh Dashboard service: A flexible and intuitive web UI based on OpenSearch Dashboards.
  # * It is used for data visualization and analysis of the indexed Wazuh alerts and system events.
  # * ---------------------------------------------------------------------------------------
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION}
    hostname: wazuh.dashboard
    restart: always
    ports:
      - 443:5601
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD} # ? Default kibana user password is usually same as indexer
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    deploy:
      resources:
        limits:
          memory: ${WAZUH_DASHBOARD_MEM_LIMIT}
    security_opt:
      - no-new-privileges:true
    networks:
      - soc_overlay
    volumes:
      # * Certificates and configuration for the dashboard
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:Z
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:Z
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:z
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:Z
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:Z
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_started
    links:  
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

# * =========================================================================================
# * Declare named volumes for persistence across container restarts and updates.
# * These volumes store configuration, logs, and queue data for the Wazuh components.
# * =========================================================================================
volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom: